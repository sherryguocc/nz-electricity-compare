<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ 电费套餐比较器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="lang-sw"><a href="en.html">English</a></div>
  <h1>⚡ NZ 电费套餐比较器</h1>
  <p class="subtitle">录入各套餐参数和预计用电量，实时比较30天月费用（NZD）</p>

  <div class="card" id="resultsCard">
    <div class="sect-title">费用对比 <span class="pill pill-g">按月总费用从低到高 · 30天</span></div>
    <div class="sum-bar" id="sumBar"><span style="color:var(--light)">请填入套餐电价和用电量…</span></div>
    <div id="peakWarn"></div>
    <table>
      <thead>
        <tr>
          <th width="38">#</th><th>公司</th><th>套餐</th>
          <th>能源费</th><th>日租费 ×30天</th><th>月总费用</th>
        </tr>
      </thead>
      <tbody id="tBody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="sect-title">套餐配置 <span class="pill">3 家公司 · 每家最多 4 个套餐</span></div>
    <div class="co-grid" id="coGrid"></div>
  </div>

  <div class="card">
    <div class="sect-title">用电量录入</div>
    <div class="mode-bar">
      <button class="mb on" onclick="setMode('simple')">粗略估计</button>
      <button class="mb" onclick="setMode('slots')">时段录入（每3小时）</button>
      <button class="mb" onclick="setMode('hourly')">精细录入（每小时）</button>
    </div>
    <div id="usagePanel"></div>
  </div>
</div>

<!-- AI Modal -->
<div class="modal-overlay" id="aiModal">
  <div class="modal-box">
    <div class="modal-head">
      <span>✨ AI 自动填入套餐</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="api-row">
        <div class="field" style="flex:1">
          <label>OpenAI API Key</label>
          <input type="password" id="apiKeyInput" placeholder="sk-…" autocomplete="off"
            style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text)">
        </div>
        <label class="save-key-lbl">
          <input type="checkbox" id="saveKeyCheck"> 记住
        </label>
      </div>
      <textarea class="ai-textarea" id="aiText"
        placeholder="将电力公司网站的定价页面文字复制粘贴到这里。包含套餐名称、电价（$/kWh）、日租费、高峰时段等信息即可，AI会自动识别并填入…"></textarea>
      <div class="ai-tip">💡 在电力公司网站找到定价页 → 全选文字（Ctrl+A）→ 复制 → 粘贴。API Key 只存在你本地浏览器，不经过任何服务器。</div>
      <div class="ai-status" id="aiStatus"></div>
      <button class="ai-run-btn" id="aiRunBtn" onclick="runAI()">✨ 解析并填入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="presets.js"></script>
<script src="common.js"></script>
<script src="zh.js"></script>
</body>
</html>
